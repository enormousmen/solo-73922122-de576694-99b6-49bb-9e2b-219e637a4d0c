services:
  cache:
    build: .
    image: firmware-cache:latest
    ports:
      - "8080:8000"
    environment:
      CACHE_DATA_DIR: /data
      CACHE_MAX_FILE_BYTES: "33554432"   # 32 MiB per file
      CACHE_QUORUM: "2"                  # machines that must agree for a hit
    volumes:
      - cache-data:/data
    restart: unless-stopped

volumes:
  cache-data:
